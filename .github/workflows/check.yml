name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mixture:
    # The self-hosted runner on Kane's Mac (~/actions-runner-aluminium).
    runs-on: [self-hosted, aluminium]
    defaults:
      run:
        working-directory: tools/mixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/mixture/package-lock.json
      - run: npm ci
      - run: npm run check
