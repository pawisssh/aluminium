name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mixture:
    # The self-hosted runner on Kane's Mac (~/actions-runner-aluminium).
    runs-on: [self-hosted, aluminium]
    defaults:
      run:
        working-directory: tools/mixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # ~/.npm stays on the runner between jobs, so no Actions cache is needed.
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run check
