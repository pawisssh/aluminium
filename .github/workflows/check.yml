name: Check

on:
  push:
    branches: [main]
  pull_request:

# Every job runs on a self-hosted runner with the `aluminium` label, whichever is online: the one on
# Kane's Mac or the one in WSL on the Windows PC (.github/runner-wsl.sh sets it up). Each is at
# ~/actions-runner-aluminium, with jq and node on its PATH and block checked out at
# ~/Projects/finnomena/block.
jobs:
  list-tools:
    runs-on: [self-hosted, aluminium]
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "tools=$(ls -d tools/*/package.json | cut -d/ -f2 | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  tool:
    needs: list-tools
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.list-tools.outputs.tools) }}
    name: tools/${{ matrix.tool }}
    runs-on: [self-hosted, aluminium]
    defaults:
      run:
        working-directory: tools/${{ matrix.tool }}
    steps:
      # Two commits deep, so a pull request's merge commit can be compared with its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # ~/.npm stays on the runner between jobs, so no Actions cache is needed.
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run check
      - run: BLOCK_REPO="$HOME/Projects/finnomena/block" npm run vendor:check --if-present
      # Reruns the whole pick of every exported Plan type's Brick, which takes three to five minutes: too
      # slow for the unit tests, and for a pull request that changes no file the pick reads. A push to
      # main always runs it, and so does a pull request whose changed files cannot be worked out.
      - id: pick-inputs
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- scripts src/core src/vendor package.json package-lock.json; then
            echo "This pull request changes no file the pick reads: bricks:check is skipped."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pick-inputs.outputs.changed != 'false'
        run: npm run bricks:check --if-present

  # Files outside tools/: a malformed .claude/settings.json makes Claude Code drop its hooks silently.
  repo-config:
    runs-on: [self-hosted, aluminium]
    steps:
      - uses: actions/checkout@v4
      - run: jq -e . .claude/*.json > /dev/null
      - run: for f in scripts/*.sh .githooks/*; do sh -n "$f"; done
      - run: sh scripts/test-hooks.sh
      - run: for f in scripts/*.mjs tools/*/scripts/*.mjs; do node --check "$f"; done
      - run: node --test scripts/*.test.mjs
