name: PR text

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# The PR title and body use GLOSSARY.md's words too; editing them re-runs only these checks.
jobs:
  glossary:
    runs-on: [self-hosted, aluminium]
    steps:
      # Temp folders go to the runner's own temp, emptied every job: the WSL distro's /tmp is a RAM disk every runner
      # on the PC shares, and tests filled it (pawisssh/design-system#1203). A step, since a job's env cannot read runner.
      - name: Use the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" | node scripts/check-glossary.mjs -

  # A merge closes every issue the PR's text closes, whether its criteria are ticked or not.
  criteria:
    runs-on: [self-hosted, aluminium]
    permissions:
      contents: read
      issues: read
    steps:
      # Temp folders go to the runner's own temp, emptied every job: the WSL distro's /tmp is a RAM disk every runner
      # on the PC shares, and tests filled it (pawisssh/design-system#1203). A step, since a job's env cannot read runner.
      - name: Use the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - env:
          BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s\n' "$BODY" | node scripts/check-closed-criteria.mjs
